name: Release

# Builds a single, platform-independent .vsix and publishes it to a GitHub
# Release. The extension uses the ripgrep that VS Code already ships, so no
# native binary is bundled and one file works on every platform.
#
# Trigger either by pushing a tag like `v0.0.1`, or manually from the Actions
# tab (uses the version in package.json as the tag).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx vsce package --out "enhanced-finder-${{ steps.version.outputs.version }}.vsix"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Enhanced Finder v${{ steps.version.outputs.version }}
          draft: false
          fail_on_unmatched_files: true
          files: enhanced-finder-${{ steps.version.outputs.version }}.vsix
          body: |
            Enhanced Finder v${{ steps.version.outputs.version }}.

            Download `enhanced-finder-${{ steps.version.outputs.version }}.vsix`
            (works on every platform) and install it with
            **Extensions → Install from VSIX…** or
            `code --install-extension enhanced-finder-${{ steps.version.outputs.version }}.vsix`.

            Uses the ripgrep bundled with your VS Code installation.
