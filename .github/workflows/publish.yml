name: Publish

# Publishes the extension to the VS Code Marketplace (and optionally Open VSX).
# Each publish step is skipped unless the corresponding token secret is
# configured, so it is safe to keep in the repo until you are ready.
#
# Prerequisites (one-time):
#   1. Create a Marketplace publisher and set `publisher` in package.json to it.
#   2. Create an Azure DevOps Personal Access Token with Marketplace > Manage.
#   3. Add it as the repo secret `VSCE_PAT` (and optionally `OVSX_TOKEN`).
# Then bump the version and run this workflow from the Actions tab.
#
# Note: releases created by the Release workflow use GITHUB_TOKEN, and GitHub
# does not re-trigger workflows from those, so in practice this runs via
# workflow_dispatch (or a release published by hand).

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # `secrets` is not allowed in a step-level `if`, so surface the tokens as
    # env vars and gate on those instead.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --no-update-package-json -p "$VSCE_PAT"

      - name: Publish to Open VSX (optional)
        if: env.OVSX_TOKEN != ''
        run: npx ovsx publish -p "$OVSX_TOKEN"

      - name: Nothing to do
        if: env.VSCE_PAT == '' && env.OVSX_TOKEN == ''
        run: echo "No VSCE_PAT or OVSX_TOKEN secret configured — skipping publish."
