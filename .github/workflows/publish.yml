name: Publish

# Publishes the extension to the VS Code Marketplace (and optionally Open VSX).
# Runs only if the corresponding token secret is configured, so it is safe to
# keep in the repo until you are ready.
#
# Prerequisites (one-time):
#   1. Create a Marketplace publisher and set `publisher` in package.json to it.
#   2. Create an Azure DevOps Personal Access Token with Marketplace > Manage.
#   3. Add it as the repo secret `VSCE_PAT` (and optionally `OVSX_TOKEN`).
# Then bump the version and run this workflow (or publish a GitHub release).

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Publish to VS Code Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish -p "${{ secrets.VSCE_PAT }}"

      - name: Publish to Open VSX (optional)
        if: ${{ secrets.OVSX_TOKEN != '' }}
        run: npx ovsx publish -p "${{ secrets.OVSX_TOKEN }}"
