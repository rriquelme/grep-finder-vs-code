name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Integration tests (headless)
        run: xvfb-run -a npm run test:integration

      # Same packaging invocation as the Release workflow, so a broken manifest
      # is caught on every push instead of at release time.
      - name: Package VSIX
        run: npx @vscode/vsce package --no-update-package-json --out grep-finder.vsix

      # Guards the "no network" promise in SECURITY.md: fails if a networking
      # API ever shows up in the shipped bundles.
      - name: Verify no networking APIs in bundles
        run: |
          if grep -nE "fetch\(|XMLHttpRequest|WebSocket|EventSource|require\(['\"](https?|net|dns|tls)['\"]\)|axios|node-fetch" dist/extension.js media/main.js; then
            echo "Networking API found in the shipped bundle — see SECURITY.md" >&2
            exit 1
          fi
          echo "No networking APIs found."

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: grep-finder-vsix
          path: grep-finder.vsix
          if-no-files-found: error
