name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Integration tests (headless)
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        run: npx @vscode/vsce package --out enhanced-finder.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-finder-vsix
          path: enhanced-finder.vsix
